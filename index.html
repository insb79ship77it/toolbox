<!DOCTYPE html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>네트워크 속도 측정기</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    :root {
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-main: #191f28;
      --text-sub: #8b95a1;
      --primary: #3182f6;
      --primary-hover: #1b64da;
      --border-color: #e5e8eb;
      --gauge-bg: #e5e8eb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, "Helvetica Neue", "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", "Apple사용자 경험(UX) 측면에서 속도 측정 중 진행 상황을 시각적으로 보여주면 지루함을 줄이고 애플리케이션이 정상적으로 작동하고 있다는 신뢰감을 줄 수 있습니다.

웹 애플리케이션에서 구현하기 좋은 **3가지 시각적 표현 방식**과 **HTML/CSS/JS 예시 코드**입니다.

---

### 1. 주요 시각적 표현 방식

* **원형 게이지 (Gauge Chart / Semi-Circle)**
  * 자동차 계기판 형태로, 현재 속도가 올라가는 모습을 실시간 바늘이나 테두리 애니메이션으로 표현합니다.
* **프로그레스 바 (Progress Bar)**
  * 전체 측정 시간(예: 5초 내외) 동안 게이지가 차오르는 형태로, 명확한 진행률(%)을 전달하기 좋습니다.
* **스피너 애니메이션 (Pulse / Spinner Animation)**
  * 중앙에 텍스트로 실시간 변하는 숫자를 보여주고, 테두리에서 파동이 치는 듯한 효과를 주어 측정 중임을 강조합니다.

---

### 2. 코드 예시 (프로그레스 바 + 실시간 숫자 반영)

HTML5와 순수 JavaScript(Vanilla JS)로 간단하게 구현할 수 있는 기본 구조입니다.

```html
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>속도 측정 라이브 예시</title>
  <style>
    .speed-container {
      width: 300px;
      padding: 20px;
      border: 1px solid #e1e1e1;
      border-radius: 12px;
      text-align: center;
      font-family: system-ui, sans-serif;
    }
    
    .speed-display {
      font-size: 2.5rem;
      font-weight: bold;
      color: #0066ff;
      margin: 10px 0;
    }

    /* 진행 바 배경 */
    .progress-track {
      width: 100%;
      height: 10px;
      background-color: #eee;
      border-radius: 5px;
      overflow: hidden;
      margin-top: 15px;
    }

    /* 진행 바 채우기 애니메이션 */
    .progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #0066ff, #00ccff);
      transition: width 0.2s ease-out;
    }
  </style>
</head>
<body>

<div class="speed-container">
  <div>다운로드 속도</div>
  <div class="speed-display" id="speedValue">0.00 <span style="font-size: 1rem;">Mbps</span></div>
  
  <div class="progress-track">
    <div class="progress-fill" id="progressBar"></div>
  </div>
  
  <button id="startBtn" style="margin-top: 15px; padding: 8px 16px;">측정 시작</button>
</div>

<script>
  const speedValueEl = document.getElementById('speedValue');
  const progressBarEl = document.getElementById('progressBar');
  const startBtn = document.getElementById('startBtn');

  startBtn.addEventListener('click', () => {
    startBtn.disabled = true;
    let progress = 0;

    // 측정 진행 상황 모의 업데이트 (실제 네트워크 연동 시 커스텀 이벤트 처리)
    const interval = setInterval(() => {
      progress += 2; // 진행률 증가
      
      // 임의의 실시간 속도 값 생성 (실제 구현 시 수신 데이터 바이트 계산 값 대입)
      const mockSpeed = (Math.random() * 50 + 50).toFixed(2);
      
      // UI 업데이트
      speedValueEl.childNodes[0].nodeValue = mockSpeed + ' ';
      progressBarEl.style.width = `${progress}%`;

      if (progress >= 100) {
        clearInterval(interval);
        startBtn.disabled = false;
      }
    }, 100);
  });
</script>

</body>
</html>
